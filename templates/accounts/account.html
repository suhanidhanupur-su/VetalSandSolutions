{% extends 'base.html' %}
{% block title %}My Account | Vetal Sand Solutions{% endblock %}

{% block content %}
<section class="auth-section" style="align-items: flex-start; padding-top: 3rem; padding-bottom: 4rem;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="account-dashboard">
                    <div class="account-summary">
                        <div>
                            <span class="section-kicker">Logged-in username</span>
                            <h3>{{ user.username }}</h3>
                        </div>
                        <div>
                            <span class="section-kicker">Email</span>
                            <h3>{{ user.email|default:'No email added' }}</h3>
                        </div>
                    </div>

                    <div class="account-links">
                        <a class="account-link" href="{% url 'order_list' %}">My Orders</a>
                        <a class="account-link" href="{% url 'wishlist_detail' %}">Wishlist</a>
                        <a class="account-link" href="{% url 'edit_profile' %}">Profile</a>
                        <a class="account-link" href="{% url 'cart_detail' %}">Cart</a>
                    </div>

                    <div class="account-actions">
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-secondary">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
