{% extends 'base.html' %}

{% block content %}
<section class="hero-section">
    <div class="container">
        <div class="row align-items-center g-4 g-lg-5">
            <div class="col-12 col-lg-6">
                <div class="hero-content">
                    <p class="hero-eyebrow">PREMIUM SILICA SAND SOLUTIONS</p>
                    <h1 class="hero-title">PURE BY NATURE. PERFECT FOR INDUSTRY.</h1>
                    <p class="hero-text">
                        High-quality silica sand solutions designed for consistent performance across demanding industrial applications.
                    </p>

                    <div class="hero-actions">
                        <a href="#" class="btn btn-primary hero-btn">Explore Products</a>
                        <a href="#" class="btn btn-secondary hero-btn">Request a Quote</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="hero-visual" aria-label="Industrial silica sand visual presentation">
                    <div class="visual-surface">
                        <div class="sand-glow"></div>
                        <div class="sand-heap">
                            <span class="grain grain-one"></span>
                            <span class="grain grain-two"></span>
                            <span class="grain grain-three"></span>
                            <span class="grain grain-four"></span>
                            <span class="grain grain-five"></span>
                            <span class="grain grain-six"></span>
                        </div>
                        <div class="visual-badge">Industrial Grade</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
